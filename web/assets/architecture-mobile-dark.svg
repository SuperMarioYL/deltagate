<svg xmlns="http://www.w3.org/2000/svg" width="420" height="760" viewBox="0 0 420 760" role="img" aria-labelledby="architecture-dark-title architecture-dark-desc" data-palette="e67f56-e7d06a-f6acb2-8282ecfa8d21">
<title id="architecture-dark-title">DeltaGate 模块图</title>
<desc id="architecture-dark-desc">store 读取目录，rules 持有唯一限值，calibrate 拟合限值，delta 比较字段，gate 汇总，report 出报告与 review.csv。</desc>
<defs>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e67f56"/><stop offset=".55" stop-color="#e7d06a"/><stop offset="1" stop-color="#f6acb2"/></linearGradient>
<radialGradient id="haze"><stop stop-color="#e67f56" stop-opacity=".30"/><stop offset="1" stop-color="#0a080d" stop-opacity="0"/></radialGradient>
<filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#3a221d" stroke-opacity=".55" stroke-width=".6"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#e67f56" stroke-width="1.5"/></marker>
</defs>
<style>
text{font-family:-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;fill:#fdeef0}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.muted{fill:#b2a5a8}
.brand{fill:url(#brand)}
.primary{fill:#e67f56}
.secondary{fill:#e7d06a}
.panel{fill:#131217;stroke:#3a221d;stroke-width:1}
.code{fill:#140f13;stroke:#3a221d;stroke-width:1}
.wire{fill:none;stroke:#3a221d;stroke-width:1.2}
.flowline{fill:none;stroke:#e67f56;stroke-width:1.8;stroke-dasharray:10 210;animation:flow 7s linear infinite}
.glow{fill:#e67f56;opacity:.35;filter:url(#soft)}
.pulse{animation:pulse 4.5s ease-in-out infinite}
.drift{animation:drift 10s ease-in-out infinite alternate}
.gather{animation:gather 1.1s ease-out both}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 90s linear infinite}
@keyframes flow{to{stroke-dashoffset:-440}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(10px,-8px)}}
@keyframes gather{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.flowline{display:none}}
</style>
<rect width="420" height="760" rx="18" fill="#0a080d"/>
<rect width="420" height="760" rx="18" fill="url(#grid)"/>
<ellipse cx="330" cy="120" rx="180" ry="160" fill="url(#haze)"/><text x="28" y="40" font-size="11" class="muted mono" letter-spacing="1.3">INTERNAL MODULES · ONE PROCESS</text><text x="28" y="70" font-size="21" class="" font-weight="600" >目录、限值、判定各归一处</text><rect x="28" y="92" width="364" height="58" rx="10" class="panel"/><text x="44" y="119" font-size="15" class="mono" font-weight="600" >accepted/ · rerun/ · history/</text><text x="44" y="139" font-size="12" class="muted" >上一版已放行 · 本次重跑 · 历史快照</text><rect x="28" y="172" width="364" height="58" rx="10" class="panel"/><text x="44" y="199" font-size="15" class="mono" font-weight="600" >store.py</text><text x="44" y="219" font-size="12" class="muted" >唯一知道目录布局；读记录、写四件产物</text><rect x="28" y="252" width="364" height="58" rx="10" class="panel"/><rect x="28" y="252" width="364" height="58" rx="10" fill="none" stroke="#e67f56" stroke-width="1.6"/><circle cx="42" cy="266" r="3.2" fill="#e67f56" class="pulse"/><text x="44" y="279" font-size="15" class="mono" font-weight="600" >rules.py</text><text x="44" y="299" font-size="12" class="muted" >限值唯一权威；版本 = 文件 sha256 前 12 位</text><rect x="28" y="332" width="364" height="58" rx="10" class="panel"/><text x="44" y="359" font-size="15" class="mono" font-weight="600" >calibrate.py</text><text x="44" y="379" font-size="12" class="muted" >分位数拟合限值，回写 rules.yaml 并测 holdout</text><rect x="28" y="412" width="364" height="58" rx="10" class="panel"/><text x="44" y="439" font-size="15" class="mono" font-weight="600" >delta.py</text><text x="44" y="459" font-size="12" class="muted" >归一化 → 逐字段差值 → 越限 / 结构变化</text><rect x="28" y="492" width="364" height="58" rx="10" class="panel"/><text x="44" y="519" font-size="15" class="mono" font-weight="600" >gate.py</text><text x="44" y="539" font-size="12" class="muted" >逐条 RELEASE / REVIEW；批次 flag_rate 与 manifest</text><rect x="28" y="572" width="364" height="58" rx="10" class="panel"/><text x="44" y="599" font-size="15" class="mono" font-weight="600" >report.py</text><text x="44" y="619" font-size="12" class="muted" >单文件 HTML（内联 CSS）与 review.csv</text><rect x="28" y="652" width="364" height="62" rx="10" class="panel"/><text x="44" y="679" font-size="15" class="mono" font-weight="600" >out/</text><text x="44" y="699" font-size="12" class="muted" >decisions.jsonl · report.html · manifest.json · review.csv</text><path d="M210 150V168" fill="none" stroke="#e67f56" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M210 150V168" class="flowline" aria-hidden="true"/><path d="M210 230V248" fill="none" stroke="#e67f56" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M210 230V248" class="flowline" aria-hidden="true"/><path d="M210 310V328" fill="none" stroke="#e67f56" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M210 310V328" class="flowline" aria-hidden="true"/><path d="M210 390V408" fill="none" stroke="#e67f56" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M210 390V408" class="flowline" aria-hidden="true"/><path d="M210 470V488" fill="none" stroke="#e67f56" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M210 470V488" class="flowline" aria-hidden="true"/><path d="M210 550V568" fill="none" stroke="#e67f56" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M210 550V568" class="flowline" aria-hidden="true"/><path d="M210 630V648" fill="none" stroke="#e67f56" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M210 630V648" class="flowline" aria-hidden="true"/><text x="210" y="742" font-size="11" class="muted" text-anchor="middle" >calibrate 只回写 rules.yaml，不碰快照目录</text>
</svg>
