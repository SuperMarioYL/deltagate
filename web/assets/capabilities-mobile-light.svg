<svg xmlns="http://www.w3.org/2000/svg" width="420" height="620" viewBox="0 0 420 620" role="img" aria-labelledby="capabilities-light-title capabilities-light-desc" data-palette="e67f56-e7d06a-f6acb2-8282ecfa8d21">
<title id="capabilities-light-title">DeltaGate 的能力边界</title>
<desc id="capabilities-light-desc">输入是已结构化 JSON；支持五类字段、四类产物、四个命令与 0/2/3/4 退出码；单进程、零网络调用。</desc>
<defs>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a95e3f"/><stop offset=".55" stop-color="#7e723a"/><stop offset="1" stop-color="#93666a"/></linearGradient>
<radialGradient id="haze"><stop stop-color="#a95e3f" stop-opacity=".16"/><stop offset="1" stop-color="#fefbf9" stop-opacity="0"/></radialGradient>
<filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#f7d8cb" stroke-opacity=".5" stroke-width=".6"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#a95e3f" stroke-width="1.5"/></marker>
</defs>
<style>
text{font-family:-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;fill:#271b1c}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.muted{fill:#72666b}
.brand{fill:url(#brand)}
.primary{fill:#a95e3f}
.secondary{fill:#7e723a}
.panel{fill:#fef9f7;stroke:#f7d8cb;stroke-width:1}
.code{fill:#fdf6f3;stroke:#f7d8cb;stroke-width:1}
.wire{fill:none;stroke:#f7d8cb;stroke-width:1.2}
.flowline{fill:none;stroke:#a95e3f;stroke-width:1.8;stroke-dasharray:10 210;animation:flow 7s linear infinite}
.glow{fill:#a95e3f;opacity:.35;filter:url(#soft)}
.pulse{animation:pulse 4.5s ease-in-out infinite}
.drift{animation:drift 10s ease-in-out infinite alternate}
.gather{animation:gather 1.1s ease-out both}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 90s linear infinite}
@keyframes flow{to{stroke-dashoffset:-440}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(10px,-8px)}}
@keyframes gather{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.flowline{display:none}}
</style>
<rect width="420" height="620" rx="18" fill="#fefbf9"/>
<rect width="420" height="620" rx="18" fill="url(#grid)"/>
<ellipse cx="210" cy="120" rx="190" ry="130" fill="url(#haze)"/><text x="28" y="40" font-size="11" class="muted mono" letter-spacing="1.2">SCOPE · STRUCTURED JSON IN, VERDICTS OUT</text><text x="28" y="70" font-size="19" class="" font-weight="600" >只吃结构化输出，不绑推理后端</text><circle cx="210" cy="140" r="44" fill="#fef9f7" stroke="#a95e3f" stroke-width="1.4"/><text x="210" y="136" font-size="15" class="mono primary" text-anchor="middle" font-weight="700" >JSON</text><text x="210" y="156" font-size="10.5" class="muted mono" text-anchor="middle" >record</text><ellipse cx="210" cy="140" rx="150" ry="58" fill="none" stroke="#f7d8cb" stroke-dasharray="3 6"/><rect x="24" y="214" width="180" height="84" rx="10" class="panel"/><text x="40" y="241" font-size="13.5" class="" font-weight="600" >输出类型</text><text x="38" y="260" font-size="10.8" class="muted" >invoice · ticket · 公文</text><text x="38" y="275" font-size="10.8" class="muted" >规则按 output_type 分表</text><rect x="216" y="214" width="180" height="84" rx="10" class="panel"/><text x="232" y="241" font-size="13.5" class="" font-weight="600" >字段类型</text><text x="230" y="260" font-size="10.8" class="muted" >money · numeric · date</text><text x="230" y="275" font-size="10.8" class="muted" >code · text</text><rect x="24" y="310" width="180" height="84" rx="10" class="panel"/><text x="40" y="337" font-size="13.5" class="" font-weight="600" >产物</text><text x="38" y="356" font-size="10.8" class="muted" >decisions.jsonl · report.html</text><text x="38" y="371" font-size="10.8" class="muted" >review.csv · manifest.json</text><rect x="216" y="310" width="180" height="84" rx="10" class="panel"/><text x="232" y="337" font-size="13.5" class="" font-weight="600" >退出码</text><text x="230" y="356" font-size="10.8" class="muted" >0 全部放行 · 3 有待复查</text><text x="230" y="371" font-size="10.8" class="muted" >4 畸形过多 · 2 参数错误</text><rect x="24" y="406" width="180" height="84" rx="10" class="panel"/><text x="40" y="433" font-size="13.5" class="" font-weight="600" >命令</text><text x="38" y="452" font-size="10.8" class="muted" >init · calibrate</text><text x="38" y="467" font-size="10.8" class="muted" >check · accept</text><rect x="216" y="406" width="180" height="84" rx="10" class="panel"/><text x="232" y="433" font-size="13.5" class="" font-weight="600" >运行边界</text><text x="230" y="452" font-size="10.8" class="muted" >单进程 · 零网络调用</text><text x="230" y="467" font-size="10.8" class="muted" >不调模型、不做 OCR</text><rect x="24" y="502" width="180" height="84" rx="10" class="panel"/><text x="40" y="529" font-size="13.5" class="" font-weight="600" >限值版本</text><text x="38" y="548" font-size="10.8" class="muted" >limits_version=v+sha256[:12]</text><text x="38" y="563" font-size="10.8" class="muted" >报告与 manifest 同源</text><rect x="216" y="502" width="180" height="84" rx="10" class="panel"/><text x="232" y="529" font-size="13.5" class="" font-weight="600" >输入</text><text x="230" y="548" font-size="10.8" class="muted" >已结构化 JSON</text><text x="230" y="563" font-size="10.8" class="muted" >每条记录一个文件</text><text x="24" y="606" font-size="11" class="muted" >它测变化量，不测正确性；留出集 flag 率把这件事说清楚。</text>
</svg>
