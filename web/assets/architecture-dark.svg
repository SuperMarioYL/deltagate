<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="architecture-dark-title architecture-dark-desc" data-palette="e67f56-e7d06a-f6acb2-8282ecfa8d21">
<title id="architecture-dark-title">DeltaGate 模块架构图</title>
<desc id="architecture-dark-desc">accepted/rerun/history 由 store 读取，rules 是限值唯一权威，delta 逐字段比较，gate 汇总判定，report 输出 HTML 与 review.csv，calibrate 回写限值。</desc>
<defs>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e67f56"/><stop offset=".55" stop-color="#e7d06a"/><stop offset="1" stop-color="#f6acb2"/></linearGradient>
<radialGradient id="haze"><stop stop-color="#e67f56" stop-opacity=".30"/><stop offset="1" stop-color="#0a080d" stop-opacity="0"/></radialGradient>
<filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#3a221d" stroke-opacity=".55" stroke-width=".6"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#e67f56" stroke-width="1.5"/></marker>
</defs>
<style>
text{font-family:-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;fill:#fdeef0}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.muted{fill:#b2a5a8}
.brand{fill:url(#brand)}
.primary{fill:#e67f56}
.secondary{fill:#e7d06a}
.panel{fill:#131217;stroke:#3a221d;stroke-width:1}
.code{fill:#140f13;stroke:#3a221d;stroke-width:1}
.wire{fill:none;stroke:#3a221d;stroke-width:1.2}
.flowline{fill:none;stroke:#e67f56;stroke-width:1.8;stroke-dasharray:10 210;animation:flow 7s linear infinite}
.glow{fill:#e67f56;opacity:.35;filter:url(#soft)}
.pulse{animation:pulse 4.5s ease-in-out infinite}
.drift{animation:drift 10s ease-in-out infinite alternate}
.gather{animation:gather 1.1s ease-out both}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 90s linear infinite}
@keyframes flow{to{stroke-dashoffset:-440}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(10px,-8px)}}
@keyframes gather{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.flowline{display:none}}
</style>
<rect width="1000" height="600" rx="18" fill="#0a080d"/>
<rect width="1000" height="600" rx="18" fill="url(#grid)"/>
<ellipse cx="600" cy="250" rx="460" ry="280" fill="url(#haze)"/><text x="40" y="48" font-size="11.5" class="muted mono" letter-spacing="1.6">INTERNAL MODULES · A SINGLE PROCESS, NO DAEMON</text><text x="40" y="82" font-size="26" class="" font-weight="600" >目录、限值、判定各归一处</text><rect x="40" y="112" width="190" height="52" rx="10" class="panel"/><text x="56" y="139" font-size="15" class="mono" font-weight="600" >accepted/</text><text x="56" y="159" font-size="12" class="muted" >上一版已人工放行</text><rect x="40" y="178" width="190" height="52" rx="10" class="panel"/><text x="56" y="205" font-size="15" class="mono" font-weight="600" >rerun/</text><text x="56" y="225" font-size="12" class="muted" >换包后的重跑结果</text><rect x="40" y="300" width="190" height="52" rx="10" class="panel"/><text x="56" y="327" font-size="15" class="mono" font-weight="600" >history/</text><text x="56" y="347" font-size="12" class="muted" >三次历史快照</text><rect x="280" y="112" width="176" height="118" rx="10" class="panel"/><rect x="280" y="112" width="176" height="118" rx="10" fill="none" stroke="#e67f56" stroke-width="1.6"/><circle cx="294" cy="126" r="3.2" fill="#e67f56" class="pulse"/><text x="296" y="139" font-size="15" class="mono" font-weight="600" >store.py</text><text x="296" y="159" font-size="12" class="muted" >唯一知道目录布局</text><text x="296" y="175" font-size="12" class="muted" >读记录</text><text x="296" y="191" font-size="12" class="muted" >写四件产物</text><rect x="520" y="112" width="176" height="76" rx="10" class="panel"/><text x="536" y="139" font-size="15" class="mono" font-weight="600" >rules.py</text><text x="536" y="159" font-size="12" class="muted" >限值唯一权威</text><text x="536" y="175" font-size="12" class="muted" >版本 = v + 文件 hash</text><rect x="520" y="236" width="176" height="76" rx="10" class="panel"/><text x="536" y="263" font-size="15" class="mono" font-weight="600" >delta.py</text><text x="536" y="283" font-size="12" class="muted" >归一化 → 逐字段差值</text><text x="536" y="299" font-size="12" class="muted" >越限 / 结构变化</text><rect x="520" y="360" width="176" height="76" rx="10" class="panel"/><text x="536" y="387" font-size="15" class="mono" font-weight="600" >calibrate.py</text><text x="536" y="407" font-size="12" class="muted" >分位数限 + holdout</text><rect x="760" y="236" width="176" height="76" rx="10" class="panel"/><text x="776" y="263" font-size="15" class="mono" font-weight="600" >gate.py</text><text x="776" y="283" font-size="12" class="muted" >逐条 RELEASE / REVIEW</text><text x="776" y="299" font-size="12" class="muted" >批次 flag_rate + manifest</text><rect x="760" y="360" width="176" height="76" rx="10" class="panel"/><text x="776" y="387" font-size="15" class="mono" font-weight="600" >report.py</text><text x="776" y="407" font-size="12" class="muted" >单文件 HTML</text><text x="776" y="423" font-size="12" class="muted" >review.csv</text><rect x="760" y="452" width="200" height="96" rx="10" class="code"/><text x="776" y="474" font-size="13" class="mono" font-weight="700" >out/</text><text x="776" y="496" font-size="11.5" class="muted mono" >decisions.jsonl</text><text x="776" y="511" font-size="11.5" class="muted mono" >report.html · manifest.json</text><text x="776" y="526" font-size="11.5" class="muted mono" >review.csv</text><path d="M230 138 H272" fill="none" stroke="#e67f56" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M230 138 H272" class="flowline" aria-hidden="true"/><path d="M230 204 H272" fill="none" stroke="#e67f56" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M230 204 H272" class="flowline" aria-hidden="true"/><path d="M230 326 H492 V384 H512" fill="none" stroke="#e67f56" stroke-width="1.5" stroke-dasharray="5 6" marker-end="url(#arrow)"/><path d="M456 170 H512 V262 H520" fill="none" stroke="#e67f56" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M456 170 H512 V262 H520" class="flowline" aria-hidden="true"/><path d="M608 188 V232" fill="none" stroke="#e67f56" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M608 188 V232" class="flowline" aria-hidden="true"/><path d="M696 274 H752" fill="none" stroke="#e67f56" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M696 274 H752" class="flowline" aria-hidden="true"/><path d="M696 398 H724 V176 H700" fill="none" stroke="#e67f56" stroke-width="1.5" stroke-dasharray="5 6" marker-end="url(#arrow)"/><path d="M848 312 V356" fill="none" stroke="#e67f56" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M848 312 V356" class="flowline" aria-hidden="true"/><path d="M848 436 V448" fill="none" stroke="#e67f56" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M848 436 V448" class="flowline" aria-hidden="true"/><text x="602" y="220" font-size="10.5" class="muted" text-anchor="end" >限值</text><text x="40" y="500" font-size="12" class="muted" >报告在每条越限旁给出实际数值限值，并注明 limits_version；manifest 只记 limits_version 与标定 provenance，不复制限值表。</text><text x="40" y="524" font-size="12" class="muted" >calibrate 只改 rules.yaml 的 limit 数字，字段类型、单位、floor 与归一化步骤保持不变。</text><text x="40" y="560" font-size="12" class="primary mono" letter-spacing=".6">零网络调用 · 零常驻服务 · 单进程</text>
</svg>
