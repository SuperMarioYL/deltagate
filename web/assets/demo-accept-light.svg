<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="demo-accept-light-title demo-accept-light-desc" data-palette="e67f56-e7d06a-f6acb2-8282ecfa8d21"><title id="demo-accept-light-title">accept archived 24 records as a new snapshot</title><desc id="demo-accept-light-desc">The reviewed batch is written under accepted/rerun-2026-11-02-20261109T223238Z with limits v0f168164212b and manifest 7076cd17d4db.</desc><rect x="0.5" y="0.5" width="759" height="299" rx="16" fill="#fdf6f3" stroke="#f7d8cb"/><rect x="660" y="18" width="72" height="26" rx="13" fill="#a95e3f" fill-opacity="0.12" stroke="#a95e3f" stroke-opacity="0.5"/><text x="696" y="36" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#a95e3f">exit 0</text><text x="28" y="38" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#72666b">04 / ACCEPT · ARCHIVE</text><text x="28" y="86" font-family="-apple-system,'Segoe UI','PingFang SC',sans-serif" font-size="21" font-weight="600" fill="#271b1c">accepted/</text><path d="M140 79 H172" stroke="#a95e3f" stroke-width="1.8"/><path d="M164 73 l8 6 l-8 6" fill="none" stroke="#a95e3f" stroke-width="1.8"/><rect x="28" y="104" width="446" height="54" rx="10" fill="#fef9f7" stroke="#f7d8cb"/><text x="44" y="126" font-family="-apple-system,'Segoe UI','PingFang SC',sans-serif" font-size="12" fill="#72666b">new snapshot</text><text x="44" y="146" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#a95e3f">rerun-2026-11-02-20261109T223238Z</text><rect x="28" y="176" width="446" height="34" rx="9" fill="none" stroke="#f7d8cb"/><text x="44" y="198" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#72666b">manifest</text><text x="120" y="198" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#271b1c">7076cd17d4db</text><text x="458" y="198" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#72666b">limits v0f168164212b</text><text x="560" y="112" text-anchor="end" font-family="-apple-system,'Segoe UI','PingFang SC',sans-serif" font-size="52" font-weight="600" fill="#a95e3f">24</text><text x="560" y="136" text-anchor="end" font-family="-apple-system,'Segoe UI','PingFang SC',sans-serif" font-size="14" fill="#72666b">record(s)</text><text x="28" y="250" font-family="-apple-system,'Segoe UI','PingFang SC',sans-serif" font-size="12.5" fill="#72666b">the batch id embeds that run&#8217;s UTC timestamp; the manifest hash follows it.</text><text x="28" y="272" font-family="-apple-system,'Segoe UI','PingFang SC',sans-serif" font-size="12.5" fill="#72666b">the same batch or review accepted twice is refused with exit 2.</text></svg>