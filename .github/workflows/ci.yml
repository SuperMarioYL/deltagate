name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -q
      - name: Smoke-test the shipped example
        run: |
          set +e
          deltagate check \
            --baseline examples/invoices/accepted \
            --candidate examples/invoices/rerun \
            --rules examples/invoices/rules.yaml \
            --out out
          status=$?
          set -e
          test "$status" -eq 3
          test "$(python -c 'import json;print(json.load(open("out/manifest.json"))["counts"]["review"])')" -eq 4
