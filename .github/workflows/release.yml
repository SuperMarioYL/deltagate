name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    name: build and attach distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
      - name: Write checksums
        run: |
          cd dist
          sha256sum ./*.whl ./*.tar.gz > checksums.txt
          cat checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
      - name: Attach distributions to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/checksums.txt
          fail_on_unmatched_files: true
          body: |
            DeltaGate ${{ github.ref_name }}.

            Install from the attached wheel:

            ```
            pip install ./deltagate-*.whl
            ```

            Verify the download against `checksums.txt`.

  pypi:
    name: publish to PyPI (opt-in)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Drop the checksum file before publishing
        run: rm -f dist/checksums.txt
      - uses: pypa/gh-action-pypi-publish@release/v1
