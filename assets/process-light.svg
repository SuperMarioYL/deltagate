<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="process-light-title process-light-desc" data-palette="e67f56-e7d06a-f6acb2-8282ecfa8d21">
<title id="process-light-title">DeltaGate 五步放行流程</title>
<desc id="process-light-desc">init、calibrate、check、review、accept；示例批次 24 条记录中 20 条 RELEASE、4 条 REVIEW，退出码 3。</desc>
<defs>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a95e3f"/><stop offset=".55" stop-color="#7e723a"/><stop offset="1" stop-color="#93666a"/></linearGradient>
<radialGradient id="haze"><stop stop-color="#a95e3f" stop-opacity=".16"/><stop offset="1" stop-color="#fefbf9" stop-opacity="0"/></radialGradient>
<filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#f7d8cb" stroke-opacity=".5" stroke-width=".6"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#a95e3f" stroke-width="1.5"/></marker>
</defs>
<style>
text{font-family:-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;fill:#271b1c}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.muted{fill:#72666b}
.brand{fill:url(#brand)}
.primary{fill:#a95e3f}
.secondary{fill:#7e723a}
.panel{fill:#fef9f7;stroke:#f7d8cb;stroke-width:1}
.code{fill:#fdf6f3;stroke:#f7d8cb;stroke-width:1}
.wire{fill:none;stroke:#f7d8cb;stroke-width:1.2}
.flowline{fill:none;stroke:#a95e3f;stroke-width:1.8;stroke-dasharray:10 210;animation:flow 7s linear infinite}
.glow{fill:#a95e3f;opacity:.35;filter:url(#soft)}
.pulse{animation:pulse 4.5s ease-in-out infinite}
.drift{animation:drift 10s ease-in-out infinite alternate}
.gather{animation:gather 1.1s ease-out both}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 90s linear infinite}
@keyframes flow{to{stroke-dashoffset:-440}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(10px,-8px)}}
@keyframes gather{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.flowline{display:none}}
</style>
<rect width="1000" height="560" rx="18" fill="#fefbf9"/>
<rect width="1000" height="560" rx="18" fill="url(#grid)"/>
<ellipse cx="520" cy="230" rx="470" ry="250" fill="url(#haze)"/><text x="32" y="46" font-size="11.5" class="muted mono" letter-spacing="1.6">RELEASE LOOP · 五步</text><text x="32" y="80" font-size="26" class="" font-weight="600" >先标定预算，再逐条放行</text><rect x="32" y="116" width="176" height="232" rx="10" class="panel"/><text x="48" y="143" font-size="17" class="mono" font-weight="600" >init</text><text x="158" y="138" font-size="11" class="muted mono" text-anchor="end" >01</text><g transform="translate(174 130) scale(.85)"><path d="M14 3v4a1 1 0 0 0 1 1h4" fill="none" stroke="#a95e3f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z" fill="none" stroke="#a95e3f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="48" y="192" font-size="9.2" class="mono" >deltagate init</text><text x="48" y="207" font-size="9.2" class="mono" >--accepted DIR --out rules.yaml</text><path d="M48 226 H192" stroke="#f7d8cb" stroke-width="1"/><text x="48" y="248" font-size="10.8" class="muted" >扫输出类型与字段</text><text x="48" y="266" font-size="10.8" class="muted" >写保守默认限</text><text x="48" y="284" font-size="10.8" class="muted" >金额 0.5% / 文本 0.2</text><path d="M208 232 H222" fill="none" stroke="#a95e3f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M208 232 H222" class="flowline" aria-hidden="true"/><rect x="222" y="116" width="176" height="232" rx="10" class="panel"/><text x="238" y="143" font-size="17" class="mono" font-weight="600" >calibrate</text><text x="348" y="138" font-size="11" class="muted mono" text-anchor="end" >02</text><g transform="translate(364 130) scale(.85)"><path d="M4 7h4M12 7h8M4 12h9M17 12h3M4 17h5M13 17h7" fill="none" stroke="#a95e3f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="238" y="192" font-size="9.2" class="mono" >deltagate calibrate</text><text x="238" y="207" font-size="9.2" class="mono" >--history DIR --budget 0.05</text><path d="M238 226 H382" stroke="#f7d8cb" stroke-width="1"/><text x="238" y="248" font-size="10.8" class="muted" >按 1-budget 取分位</text><text x="238" y="266" font-size="10.8" class="muted" >3 快照 → 95 分位</text><text x="238" y="284" font-size="10.8" class="muted" >holdout 3.1%</text><path d="M398 232 H412" fill="none" stroke="#a95e3f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M398 232 H412" class="flowline" aria-hidden="true"/><rect x="412" y="116" width="176" height="232" rx="10" class="panel"/><rect x="412" y="116" width="176" height="232" rx="10" fill="none" stroke="#a95e3f" stroke-width="1.6"/><circle cx="426" cy="130" r="3.2" fill="#a95e3f" class="pulse"/><text x="428" y="143" font-size="17" class="mono" font-weight="600" >check</text><text x="538" y="138" font-size="11" class="muted mono" text-anchor="end" >03</text><g transform="translate(554 130) scale(.85)"><path d="M12 3a12 12 0 0 0 8.5 3 12 12 0 0 1-8.5 15 12 12 0 0 1-8.5-15 12 12 0 0 0 8.5-3z" fill="none" stroke="#a95e3f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="m9 12 2 2 4-4" fill="none" stroke="#a95e3f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="428" y="192" font-size="9.2" class="mono primary" >deltagate check</text><text x="428" y="207" font-size="9.2" class="mono primary" >--baseline A --candidate B</text><path d="M428 226 H572" stroke="#f7d8cb" stroke-width="1"/><text x="428" y="248" font-size="10.8" class="muted" >逐条比对落清单</text><text x="428" y="266" font-size="10.8" class="muted" >24 → 20 / 4 REVIEW</text><rect x="428" y="306" width="62" height="26" rx="13" fill="#a95e3f" fill-opacity=".16" stroke="#a95e3f" stroke-width="1.2"/><text x="459.0" y="324" font-size="12" class="primary" text-anchor="middle" font-weight="700" >exit 3</text><text x="498" y="323" font-size="10.5" class="muted" >4 进队列</text><path d="M588 232 H602" fill="none" stroke="#a95e3f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M588 232 H602" class="flowline" aria-hidden="true"/><rect x="602" y="116" width="176" height="232" rx="10" class="panel"/><text x="618" y="143" font-size="17" class="mono" font-weight="600" >review</text><text x="728" y="138" font-size="11" class="muted mono" text-anchor="end" >04</text><g transform="translate(744 130) scale(.85)"><path d="M9 6h11M9 12h11M9 18h11" fill="none" stroke="#a95e3f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="m4 6 1 1 2-2" fill="none" stroke="#a95e3f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="m4 12 1 1 2-2" fill="none" stroke="#a95e3f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="m4 18 1 1 2-2" fill="none" stroke="#a95e3f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="618" y="192" font-size="9.2" class="mono" >out/review.csv</text><path d="M618 226 H762" stroke="#f7d8cb" stroke-width="1"/><text x="618" y="248" font-size="10.8" class="muted" >只有 4 条进人工队列</text><text x="618" y="266" font-size="10.8" class="muted" >填 release / reject</text><text x="618" y="284" font-size="10.8" class="muted" >+ 一行理由</text><path d="M778 232 H792" fill="none" stroke="#a95e3f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M778 232 H792" class="flowline" aria-hidden="true"/><rect x="792" y="116" width="176" height="232" rx="10" class="panel"/><text x="808" y="143" font-size="17" class="mono" font-weight="600" >accept</text><text x="918" y="138" font-size="11" class="muted mono" text-anchor="end" >05</text><g transform="translate(934 130) scale(.85)"><path d="M3 4h18v4H3z" fill="none" stroke="#a95e3f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 8v11a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8" fill="none" stroke="#a95e3f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 12h4" fill="none" stroke="#a95e3f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="808" y="192" font-size="9.2" class="mono" >deltagate accept</text><text x="808" y="207" font-size="9.2" class="mono" >--manifest M --review R</text><path d="M808 226 H952" stroke="#f7d8cb" stroke-width="1"/><text x="808" y="248" font-size="10.8" class="muted" >新快照 + manifest</text><text x="808" y="266" font-size="10.8" class="muted" >一起归档</text><text x="808" y="284" font-size="10.8" class="muted" >重复 accept 被拒</text><rect x="32" y="380" width="936" height="96" rx="12" class="panel"/><text x="52" y="406" font-size="14" class="" font-weight="600" >同一批 24 条：未越限的 20 条不动，只有 4 条进入人工队列</text><circle cx="54" cy="434" r="4.6" fill="#72666b" opacity=".55"/><circle cx="74" cy="434" r="4.6" fill="#72666b" opacity=".55"/><circle cx="94" cy="434" r="4.6" fill="#72666b" opacity=".55"/><circle cx="114" cy="434" r="4.6" fill="#72666b" opacity=".55"/><circle cx="134" cy="434" r="4.6" fill="#72666b" opacity=".55"/><circle cx="154" cy="434" r="4.6" fill="#72666b" opacity=".55"/><circle cx="174" cy="434" r="4.6" fill="#72666b" opacity=".55"/><circle cx="194" cy="434" r="4.6" fill="#72666b" opacity=".55"/><circle cx="214" cy="434" r="4.6" fill="#72666b" opacity=".55"/><circle cx="234" cy="434" r="4.6" fill="#72666b" opacity=".55"/><circle cx="254" cy="434" r="4.6" fill="#72666b" opacity=".55"/><circle cx="274" cy="434" r="4.6" fill="#72666b" opacity=".55"/><circle cx="54" cy="454" r="4.6" fill="#72666b" opacity=".55"/><circle cx="74" cy="454" r="4.6" fill="#72666b" opacity=".55"/><circle cx="94" cy="454" r="4.6" fill="#72666b" opacity=".55"/><circle cx="114" cy="454" r="4.6" fill="#72666b" opacity=".55"/><circle cx="134" cy="454" r="4.6" fill="#72666b" opacity=".55"/><circle cx="154" cy="454" r="4.6" fill="#72666b" opacity=".55"/><circle cx="174" cy="454" r="4.6" fill="#72666b" opacity=".55"/><circle cx="194" cy="454" r="4.6" fill="#72666b" opacity=".55"/><rect x="209.4" y="449.4" width="9.2" height="9.2" rx="2" fill="#a95e3f" class="pulse"/><rect x="229.4" y="449.4" width="9.2" height="9.2" rx="2" fill="#a95e3f" class="pulse"/><rect x="249.4" y="449.4" width="9.2" height="9.2" rx="2" fill="#a95e3f" class="pulse"/><rect x="269.4" y="449.4" width="9.2" height="9.2" rx="2" fill="#a95e3f" class="pulse"/><text x="310" y="444" font-size="13" class="muted mono" font-weight="700" >20 RELEASE</text><text x="310" y="468" font-size="12" class="primary mono" >4 REVIEW（2 金额越限 + 2 数组长度变化）</text><text x="32" y="520" font-size="11.5" class="muted" >REVIEW 是记录级判定：任一字段越限或结构变化，整条记录进队列；不存在批次总分通路。</text>
</svg>
