<svg xmlns="http://www.w3.org/2000/svg" width="420" height="900" viewBox="0 0 420 900" role="img" aria-labelledby="process-dark-title process-dark-desc" data-palette="e67f56-e7d06a-f6acb2-8282ecfa8d21">
<title id="process-dark-title">DeltaGate 放行流程</title>
<desc id="process-dark-desc">init、calibrate、check、review、accept 五步；示例批次 24 条记录给出 20 RELEASE、4 REVIEW、退出码 3。</desc>
<defs>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e67f56"/><stop offset=".55" stop-color="#e7d06a"/><stop offset="1" stop-color="#f6acb2"/></linearGradient>
<radialGradient id="haze"><stop stop-color="#e67f56" stop-opacity=".30"/><stop offset="1" stop-color="#0a080d" stop-opacity="0"/></radialGradient>
<filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#3a221d" stroke-opacity=".55" stroke-width=".6"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#e67f56" stroke-width="1.5"/></marker>
</defs>
<style>
text{font-family:-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;fill:#fdeef0}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.muted{fill:#b2a5a8}
.brand{fill:url(#brand)}
.primary{fill:#e67f56}
.secondary{fill:#e7d06a}
.panel{fill:#131217;stroke:#3a221d;stroke-width:1}
.code{fill:#140f13;stroke:#3a221d;stroke-width:1}
.wire{fill:none;stroke:#3a221d;stroke-width:1.2}
.flowline{fill:none;stroke:#e67f56;stroke-width:1.8;stroke-dasharray:10 210;animation:flow 7s linear infinite}
.glow{fill:#e67f56;opacity:.35;filter:url(#soft)}
.pulse{animation:pulse 4.5s ease-in-out infinite}
.drift{animation:drift 10s ease-in-out infinite alternate}
.gather{animation:gather 1.1s ease-out both}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 90s linear infinite}
@keyframes flow{to{stroke-dashoffset:-440}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(10px,-8px)}}
@keyframes gather{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.flowline{display:none}}
</style>
<rect width="420" height="900" rx="18" fill="#0a080d"/>
<rect width="420" height="900" rx="18" fill="url(#grid)"/>
<ellipse cx="320" cy="130" rx="170" ry="150" fill="url(#haze)"/><text x="28" y="40" font-size="11" class="muted mono" letter-spacing="1.3">RELEASE LOOP · 五步</text><text x="28" y="70" font-size="21" class="" font-weight="600" >先标定预算，再逐条放行</text><rect x="28" y="96" width="364" height="142" rx="10" class="panel"/><text x="44" y="123" font-size="16" class="mono" font-weight="600" >init</text><g transform="translate(312 108) scale(.85)"><path d="M14 3v4a1 1 0 0 0 1 1h4" fill="none" stroke="#e67f56" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z" fill="none" stroke="#e67f56" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="300" y="124" font-size="11" class="muted mono" text-anchor="end" >01</text><text x="48" y="154" font-size="10.2" class="mono" >deltagate init</text><text x="48" y="169" font-size="10.2" class="mono" >--accepted DIR --out rules.yaml</text><text x="48" y="190" font-size="10.8" class="muted" >扫输出类型与字段</text><text x="48" y="206" font-size="10.8" class="muted" >写保守默认限</text><text x="48" y="222" font-size="10.8" class="muted" >金额 0.5% / 文本 0.2</text><rect x="28" y="248" width="364" height="142" rx="10" class="panel"/><text x="44" y="275" font-size="16" class="mono" font-weight="600" >calibrate</text><g transform="translate(312 260) scale(.85)"><path d="M4 7h4M12 7h8M4 12h9M17 12h3M4 17h5M13 17h7" fill="none" stroke="#e67f56" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="300" y="276" font-size="11" class="muted mono" text-anchor="end" >02</text><text x="48" y="306" font-size="10.2" class="mono" >deltagate calibrate</text><text x="48" y="321" font-size="10.2" class="mono" >--history DIR --budget 0.05</text><text x="48" y="342" font-size="10.8" class="muted" >按 1-budget 取分位</text><text x="48" y="358" font-size="10.8" class="muted" >3 快照 → 95 分位</text><text x="48" y="374" font-size="10.8" class="muted" >holdout 3.1%</text><rect x="28" y="400" width="364" height="142" rx="10" class="panel"/><rect x="28" y="400" width="364" height="142" rx="10" fill="none" stroke="#e67f56" stroke-width="1.6"/><circle cx="42" cy="414" r="3.2" fill="#e67f56" class="pulse"/><text x="44" y="427" font-size="16" class="mono" font-weight="600" >check</text><g transform="translate(312 412) scale(.85)"><path d="M12 3a12 12 0 0 0 8.5 3 12 12 0 0 1-8.5 15 12 12 0 0 1-8.5-15 12 12 0 0 0 8.5-3z" fill="none" stroke="#e67f56" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="m9 12 2 2 4-4" fill="none" stroke="#e67f56" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="300" y="428" font-size="11" class="muted mono" text-anchor="end" >03</text><text x="48" y="458" font-size="10.2" class="mono primary" >deltagate check</text><text x="48" y="473" font-size="10.2" class="mono primary" >--baseline A --candidate B</text><text x="48" y="494" font-size="10.8" class="muted" >逐条比对落清单</text><text x="48" y="510" font-size="10.8" class="primary mono" >24 → 20 / 4 REVIEW</text><rect x="248" y="494" width="60" height="26" rx="13" fill="#e67f56" fill-opacity=".16" stroke="#e67f56" stroke-width="1.2"/><text x="278.0" y="512" font-size="12" class="primary" text-anchor="middle" font-weight="700" >exit 3</text><rect x="28" y="552" width="364" height="142" rx="10" class="panel"/><text x="44" y="579" font-size="16" class="mono" font-weight="600" >review</text><g transform="translate(312 564) scale(.85)"><path d="M9 6h11M9 12h11M9 18h11" fill="none" stroke="#e67f56" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="m4 6 1 1 2-2" fill="none" stroke="#e67f56" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="m4 12 1 1 2-2" fill="none" stroke="#e67f56" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="m4 18 1 1 2-2" fill="none" stroke="#e67f56" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="300" y="580" font-size="11" class="muted mono" text-anchor="end" >04</text><text x="48" y="610" font-size="10.2" class="mono" >out/review.csv</text><text x="48" y="646" font-size="10.8" class="muted" >只有 4 条进人工队列</text><text x="48" y="662" font-size="10.8" class="muted" >填 release / reject</text><text x="48" y="678" font-size="10.8" class="muted" >+ 一行理由</text><rect x="28" y="704" width="364" height="142" rx="10" class="panel"/><text x="44" y="731" font-size="16" class="mono" font-weight="600" >accept</text><g transform="translate(312 716) scale(.85)"><path d="M3 4h18v4H3z" fill="none" stroke="#e67f56" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 8v11a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8" fill="none" stroke="#e67f56" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 12h4" fill="none" stroke="#e67f56" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="300" y="732" font-size="11" class="muted mono" text-anchor="end" >05</text><text x="48" y="762" font-size="10.2" class="mono" >deltagate accept</text><text x="48" y="777" font-size="10.2" class="mono" >--manifest M --review R</text><text x="48" y="798" font-size="10.8" class="muted" >新快照 + manifest</text><text x="48" y="814" font-size="10.8" class="muted" >一起归档</text><text x="48" y="830" font-size="10.8" class="muted" >重复 accept 被拒</text><text x="28" y="878" font-size="11" class="muted" >未越限的记录不进入人工队列；判定单元永远是单条记录。</text>
</svg>
