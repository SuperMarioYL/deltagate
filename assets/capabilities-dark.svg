<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="capabilities-dark-title capabilities-dark-desc" data-palette="e67f56-e7d06a-f6acb2-8282ecfa8d21">
<title id="capabilities-dark-title">DeltaGate 的能力与边界</title>
<desc id="capabilities-dark-desc">以结构化 JSON 为中心：五类字段、四类产物、四个命令、0/2/3/4 退出码；零网络调用，不做抽取或 OCR。</desc>
<defs>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e67f56"/><stop offset=".55" stop-color="#e7d06a"/><stop offset="1" stop-color="#f6acb2"/></linearGradient>
<radialGradient id="haze"><stop stop-color="#e67f56" stop-opacity=".30"/><stop offset="1" stop-color="#0a080d" stop-opacity="0"/></radialGradient>
<filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#3a221d" stroke-opacity=".55" stroke-width=".6"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#e67f56" stroke-width="1.5"/></marker>
</defs>
<style>
text{font-family:-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;fill:#fdeef0}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.muted{fill:#b2a5a8}
.brand{fill:url(#brand)}
.primary{fill:#e67f56}
.secondary{fill:#e7d06a}
.panel{fill:#131217;stroke:#3a221d;stroke-width:1}
.code{fill:#140f13;stroke:#3a221d;stroke-width:1}
.wire{fill:none;stroke:#3a221d;stroke-width:1.2}
.flowline{fill:none;stroke:#e67f56;stroke-width:1.8;stroke-dasharray:10 210;animation:flow 7s linear infinite}
.glow{fill:#e67f56;opacity:.35;filter:url(#soft)}
.pulse{animation:pulse 4.5s ease-in-out infinite}
.drift{animation:drift 10s ease-in-out infinite alternate}
.gather{animation:gather 1.1s ease-out both}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 90s linear infinite}
@keyframes flow{to{stroke-dashoffset:-440}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(10px,-8px)}}
@keyframes gather{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.flowline{display:none}}
</style>
<rect width="1000" height="600" rx="18" fill="#0a080d"/>
<rect width="1000" height="600" rx="18" fill="url(#grid)"/>
<ellipse cx="500" cy="320" rx="470" ry="260" fill="url(#haze)"/><text x="36" y="46" font-size="11.5" class="muted mono" letter-spacing="1.6">SCOPE · STRUCTURED JSON IN, VERDICTS OUT</text><text x="36" y="80" font-size="26" class="" font-weight="600" >只吃结构化输出，不绑推理后端</text><ellipse cx="500" cy="316" rx="352" ry="176" fill="none" stroke="#3a221d" stroke-dasharray="3 7" class="spin"/><ellipse cx="500" cy="316" rx="270" ry="128" fill="none" stroke="#3a221d" stroke-dasharray="3 7"/><circle cx="500" cy="316" r="62" class="glow"/><circle cx="500" cy="316" r="54" fill="#131217" stroke="#e67f56" stroke-width="1.5"/><text x="500" y="310" font-size="19" class="mono primary" text-anchor="middle" font-weight="700" >JSON</text><text x="500" y="332" font-size="11.5" class="muted" text-anchor="middle" >已结构化记录</text><path d="M572.0 316.0 L738.0 316.0" stroke="#3a221d" stroke-width="1.2" stroke-dasharray="3 5"/><path d="M564.3 283.7 L647.1 207.2" stroke="#3a221d" stroke-width="1.2" stroke-dasharray="3 5"/><path d="M500.0 244.0 L500.0 176.0" stroke="#3a221d" stroke-width="1.2" stroke-dasharray="3 5"/><path d="M435.7 283.7 L352.9 207.2" stroke="#3a221d" stroke-width="1.2" stroke-dasharray="3 5"/><path d="M428.0 316.0 L262.0 316.0" stroke="#3a221d" stroke-width="1.2" stroke-dasharray="3 5"/><path d="M435.7 348.3 L352.9 424.8" stroke="#3a221d" stroke-width="1.2" stroke-dasharray="3 5"/><path d="M500.0 388.0 L500.0 456.0" stroke="#3a221d" stroke-width="1.2" stroke-dasharray="3 5"/><path d="M564.3 348.3 L647.1 424.8" stroke="#3a221d" stroke-width="1.2" stroke-dasharray="3 5"/><rect x="744" y="286" width="216" height="60" rx="10" class="panel"/><text x="852" y="304" font-size="12.5" class="" text-anchor="middle" font-weight="600" >输出类型</text><text x="852" y="322" font-size="10.6" class="muted mono" text-anchor="middle" >invoice · ticket · 公文</text><text x="852" y="337" font-size="10.6" class="muted mono" text-anchor="middle" >规则按 output_type 分表</text><rect x="641" y="161" width="216" height="60" rx="10" class="panel"/><text x="749" y="179" font-size="12.5" class="" text-anchor="middle" font-weight="600" >字段类型</text><text x="749" y="197" font-size="10.6" class="muted mono" text-anchor="middle" >money · numeric · date</text><text x="749" y="212" font-size="10.6" class="muted mono" text-anchor="middle" >code · text</text><rect x="392" y="110" width="216" height="60" rx="10" class="panel"/><text x="500" y="128" font-size="12.5" class="" text-anchor="middle" font-weight="600" >产物</text><text x="500" y="146" font-size="10.6" class="muted mono" text-anchor="middle" >decisions.jsonl · report.html</text><text x="500" y="161" font-size="10.6" class="muted mono" text-anchor="middle" >review.csv · manifest.json</text><rect x="143" y="161" width="216" height="60" rx="10" class="panel"/><text x="251" y="179" font-size="12.5" class="" text-anchor="middle" font-weight="600" >退出码</text><text x="251" y="197" font-size="10.6" class="muted mono" text-anchor="middle" >0 全部放行 · 3 有待复查</text><text x="251" y="212" font-size="10.6" class="muted mono" text-anchor="middle" >4 畸形过多 · 2 参数错误</text><rect x="40" y="286" width="216" height="60" rx="10" class="panel"/><text x="148" y="304" font-size="12.5" class="" text-anchor="middle" font-weight="600" >命令</text><text x="148" y="322" font-size="10.6" class="muted mono" text-anchor="middle" >init · calibrate</text><text x="148" y="337" font-size="10.6" class="muted mono" text-anchor="middle" >check · accept</text><rect x="143" y="411" width="216" height="60" rx="10" class="panel"/><text x="251" y="429" font-size="12.5" class="" text-anchor="middle" font-weight="600" >运行边界</text><text x="251" y="447" font-size="10.6" class="muted mono" text-anchor="middle" >单进程 · 零网络调用</text><text x="251" y="462" font-size="10.6" class="muted mono" text-anchor="middle" >不调模型、不做 OCR</text><rect x="392" y="462" width="216" height="60" rx="10" class="panel"/><text x="500" y="480" font-size="12.5" class="" text-anchor="middle" font-weight="600" >限值版本</text><text x="500" y="498" font-size="10.6" class="muted mono" text-anchor="middle" >limits_version = v + sha256[:12]</text><text x="500" y="513" font-size="10.6" class="muted mono" text-anchor="middle" >报告与 manifest 同源</text><rect x="641" y="411" width="216" height="60" rx="10" class="panel"/><text x="749" y="429" font-size="12.5" class="" text-anchor="middle" font-weight="600" >输入</text><text x="749" y="447" font-size="10.6" class="muted mono" text-anchor="middle" >已结构化 JSON</text><text x="749" y="462" font-size="10.6" class="muted mono" text-anchor="middle" >每条记录一个文件</text><text x="36" y="560" font-size="12" class="muted" >范围之外：不做抽取、不调模型、不做 OCR；不支持 PDF / 图片 / Excel 直接输入。</text><text x="36" y="584" font-size="12" class="primary" >它测变化量，不测正确性；留出集 flag 率把这件事说清楚。</text>
</svg>
